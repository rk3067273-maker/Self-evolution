name: Build Brahma AI Evo Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies & build web bundle
        run: |
          npm install --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps
          npm run lint
          npm run build
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: 'basic'

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Brahma-AI-Evo.apk

      - name: Upload Brahma AI Evo APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Brahma-AI-Evo-Android-APK
          path: android/app/build/outputs/apk/debug/Brahma-AI-Evo.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Brahma AI Evo Android v1.0.${{ github.run_number }}
          body: Direct installable Android APK built automatically for Brahma AI Evo.
          files: android/app/build/outputs/apk/debug/Brahma-AI-Evo.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: 'true'
